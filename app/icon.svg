<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Luventra">
  <!--
    The Luventra mark: ragged in, flush out.

    Left column — three rules of unequal length, ending where they happen to
    end. That is a bank's CSV: the same data, shaped differently by every
    institution that exports it. Right column — the same three rules, cut to a
    single measure. That is the OFX the engine emits.

    The vertical seam is the engine itself: everything to its left is the
    world's formatting, everything to its right is the specification's. The
    three ticks on the seam are registration marks, the same device used on the
    drop target in the app, so the mark and the product are drawn in one hand.

    Reads at 16px because it is six bars and a line; the meaning survives even
    when the ticks stop resolving.
  -->
  <rect width="32" height="32" rx="6.5" fill="#09090b"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6" fill="none" stroke="#27272a"/>

  <g fill="#71717a">
    <rect x="6" y="9" width="8" height="3" rx="0.4"/>
    <rect x="6" y="14.5" width="4" height="3" rx="0.4"/>
    <rect x="6" y="20" width="6.5" height="3" rx="0.4"/>
  </g>

  <path d="M16 7.5V24.5" stroke="#3f3f46" stroke-width="1" stroke-linecap="round"/>
  <g fill="#52525b">
    <rect x="15" y="10.25" width="2" height="0.7"/>
    <rect x="15" y="15.75" width="2" height="0.7"/>
    <rect x="15" y="21.25" width="2" height="0.7"/>
  </g>

  <g fill="#10b981">
    <rect x="18" y="9" width="8" height="3" rx="0.4"/>
    <rect x="18" y="14.5" width="8" height="3" rx="0.4"/>
    <rect x="18" y="20" width="8" height="3" rx="0.4"/>
  </g>
</svg>
